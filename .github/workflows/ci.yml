name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --experimental-strip-types --test packages/shared/tests/*.test.mjs
      - run: g++ -std=c++11 -Wall -Wextra -Werror firmware/tests/sc8-parser.test.cpp -o /tmp/sc8-parser-test && /tmp/sc8-parser-test
      - run: pnpm --filter @hitl/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  migrations:
    name: Apply migrations to Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hitl
          POSTGRES_PASSWORD: hitl
          POSTGRES_DB: hitl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hitl" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://hitl:hitl@localhost:5432/hitl
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hitl/db...
      - run: pnpm db:migrate
      - name: Schema and migrations agree
        working-directory: packages/db
        run: |
          pnpm exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "src/schema.ts changed without a migration. Run pnpm db:generate and commit the result."
            git status --porcelain migrations
            exit 1
          fi

  ml:
    name: Test ml service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/ml/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [web, ml]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/web/Dockerfile -t hitl-web .
      - run: docker build -f packages/db/Dockerfile -t hitl-migrate .
      - run: docker build -t hitl-ml packages/ml
